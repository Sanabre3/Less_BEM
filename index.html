<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="produtos">
        <div class="produto">
            <img class="produto__imagem" src="https://placehold.co/100x100" alt="Nome do produto">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
            <span class="produto__preco">R$ 99,90</span>
            <button class="produto__botao">Comprar</button>
        </div>
        <div class="produto produto--em-destaque">
            <span class="produto__selo">Destaque</span>
            <img class="produto__imagem" src="https://placehold.co/100x100" alt="Nome do produto">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
            <span class="produto__preco">R$ 79,90</span>
            <button class="produto__botao">Comprar</button>
        </div>
        <div class="produto">
            <img class="produto__imagem" src="https://placehold.co/100x100" alt="Nome do produto">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
            <span class="produto__preco">R$ 99,90</span>
            <button class="produto__botao">Comprar</button>
        </div>
    </div>
</body>
</html>
